<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk Toko</title>
</head>
<body>

    <h1>Manajemen Produk Toko</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Stok</th>
            </tr>
        </thead>

        <tbody id="daftarProduk">
            <!-- Data produk akan ditampilkan di sini -->
        </tbody>
    </table>

    <script>
        // Array produkToko
        let produkToko = [
            {
                id: 1,
                nama: "Laptop",
                harga: 7000000,
                stok: 5
            },
            {
                id: 2,
                nama: "Mouse",
                harga: 200000,
                stok: 10
            },
            {
                id: 3,
                nama: "Keyboard",
                harga: 350000,
                stok: 7
            }
        ];


        // Fungsi menambahkan produk
        function tambahProduk(nama, harga, stok) {

            let idBaru = produkToko.length + 1;

            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };

            produkToko.push(produkBaru);

            tampilkanProduk();
        }


        // Fungsi menghapus produk berdasarkan ID
        function hapusProduk(id) {

            produkToko = produkToko.filter(function(produk) {
                return produk.id !== id;
            });

            tampilkanProduk();
        }


        // Fungsi menampilkan produk
        function tampilkanProduk() {

            let tabel = document.getElementById("daftarProduk");

            tabel.innerHTML = "";

            produkToko.forEach(function(produk) {

                tabel.innerHTML += `
                    <tr>
                        <td>${produk.id}</td>
                        <td>${produk.nama}</td>
                        <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
                        <td>${produk.stok}</td>
                    </tr>
                `;

            });
        }


        // Menampilkan data pertama kali
        tampilkanProduk();

        tambahProduk("Headset", 500000, 8);
        hapusProduk(2);

    </script>

</body>
</html>
